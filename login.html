<!DOCTYPE html>
<html>
<head>
<title>Login Portal</title>

<link rel="stylesheet" href="static\css\style.css">
    <style>
        body {
            font-family: Arial;
            background-image: url("/static/images/bg.jpeg");
            color: black;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            padding: 25px 30px;
            background: rgb(181, 214, 236);
            border-radius: 12px;
            box-shadow: 0px 8px 20px gray;
            text-align: center;
        }
    </style>    
<script>
function showStudent(){
    document.getElementById("student").style.display="block";
    document.getElementById("admin").style.display="none";
}

function showAdmin(){
    document.getElementById("student").style.display="none";
    document.getElementById("admin").style.display="block";
}
</script>

</head>

<body>

<div class="container">

<h2>Project Submission Portal</h2>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<div class="tabs">
<button onclick="showStudent()">Student Login</button>
<button onclick="showAdmin()">Admin Login</button>
</div>

<!-- Student Login -->

<div id="student">

<h3>Student Login</h3>

<form method="post" action="/student_login">

<input type="text" name="username" placeholder="username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<a href="/register">New student? Register</a>

</div>


<!-- Admin Login -->

<div id="admin" style="display:none">

<h3>Admin Login</h3>

<form method="post" action="/admin_login">

<input type="text" name="username" placeholder="Admin Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

</div>

</div>

</body>
</html>
