<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("/static/images/bg.jpeg");
            margin: 0;
            padding: 0;
        }

        /* Center container */
        .container {
            width: 350px;
            margin: 80px auto;
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        /* Heading */
        .container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        /* Input fields */
        .container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: 0.3s;
        }

        /* Input focus */
        .container input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 5px rgba(79,172,254,0.5);
        }

        /* Button */
        .container button {
            width: 100%;
            padding: 10px;
            background: #4facfe;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        /* Button hover */
        .container button:hover {
            background: #00c6ff;
        }
    </style>

</head>

<body>

<div class="container">
    <h2>Student Registration</h2>

    <form method="post">
        <input type="text" name="name" placeholder="Enter Name" required>
        <input type="text" name="username" placeholder="Enter username" required>
        <input type="password" name="password" placeholder="Enter Password" required>
        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
